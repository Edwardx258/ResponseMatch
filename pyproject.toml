[project]
name = "responsematch"
version = "0.1.0"
description = "Match community service requests to volunteers with a dual-track (rules + LLM) LangGraph workflow."
readme = "README.md"
authors = [
    { name = "Yixuan Xiong" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
